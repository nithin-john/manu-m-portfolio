<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manu MA — Forensic Quality Engineer &amp; Detective Vision Architecture</title>
  <meta name="description" content="Manu MA — Forensic Quality Control Engineer. Bat-Family crime scene investigation and zero-defect architecture." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <!-- Fonts: Gilroy (Headings & UI) + Poppins (Descriptions & Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet" />

  <!-- Bootstrap Icons (Crime & Forensic Investigation Icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <link rel="stylesheet" href="src/styles/main.css" />
</head>
<body class="is-loading">

  <!-- Interactive Gotham Crime Scene Canvas (Evidence markers, Ballistic Lasers, Detective Vision) -->
  <canvas id="crime-scene-canvas"></canvas>

  <!-- Police / Detective Preloader -->
  <div id="preloader" class="preloader">
    <div class="pl-content">
      <div class="pl-police-tape"><i class="bi bi-shield-shaded"></i> GOTHAM PD FORENSIC ARCHIVE</div>
      <div class="pl-logo">MANU MA</div>
      <div class="pl-sub-dossier">OPENING CLASSIFIED CASE FILE #QC-2026</div>
      <div class="pl-bar-outer"><div class="pl-bar-inner" id="pl-bar"></div></div>
      <div class="pl-pct"><span id="pl-num">0</span>% DECRYPTED</div>
    </div>
  </div>

  <!-- Custom Fingerprint / Forensic Crosshair Cursor -->
  <div id="cursor-dot" class="cursor-dot"></div>
  <div id="cursor-ring" class="cursor-ring"></div>

  <!-- Fixed Navigation -->
  <div id="nav-mount"></div>

  <!-- Main Crime Scene Dossier Sections with Slide-Up Transition -->
  <main id="main-content">
    <div id="hero-mount" class="section-slide-up"></div>
    <div id="about-mount" class="section-slide-up"></div>
    <div id="work-mount" class="section-slide-up"></div>
    <div id="experience-mount" class="section-slide-up"></div>
    <div id="skills-mount" class="section-slide-up"></div>
    <div id="process-mount" class="section-slide-up"></div>
    <div id="services-mount" class="section-slide-up"></div>
    <div id="cv-mount" class="section-slide-up"></div>
    <div id="contact-mount" class="section-slide-up"></div>
  </main>

  <div id="footer-mount"></div>
  <div id="modal-mount"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
